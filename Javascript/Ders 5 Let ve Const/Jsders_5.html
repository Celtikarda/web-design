<!doctype html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=      , initial-scale=1.0" />
  <title>Let ve const</title>
</head>

<body>
  <script>
    //Blok değişkeni tanımlama. Let ve const aynı zamanda blok değişkenidir.
    const pi = 3.14; //Değişkenin değeri hiçbir zaman değişmeyecek ise const kullanılır
    let x = 1; //Değişkenin değeri değişmeyen/değişecek ise let kullanılır.
  </script>
</body>

</html>
